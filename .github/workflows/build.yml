# .github/workflows/build.yml — multi-platform Farnsworth builds
#
# Triggers:
#   - Push of a `v*` tag (e.g. v0.1.1) → build + publish a GitHub Release
#   - Manual dispatch → build without publishing (for testing)
#
# Build matrix:
#   - macos-latest → BUILD VALIDATION ONLY, never published. Signed Mac
#     artifacts are produced locally on the Mac mini and uploaded by hand.
#     See the long comment on the macOS step for why publishing here would
#     break auto-update for every Mac user.
#   - windows-latest → .exe via NSIS (x64). Unsigned for now (no EV cert).
#     SmartScreen will warn on first launch — users click "More info" → "Run anyway".
#   - ubuntu-latest → .AppImage + .deb. No signing needed.
#
# Secrets: NONE are required, and as of Aug 2 the repo has none
# (`GET /actions/secrets` → total_count 0). Do not reintroduce
# `CSC_LINK: ${{ secrets.MISSING }}`-style env wiring: an absent secret
# expands to an empty string rather than being unset, which electron-builder
# resolves as a filesystem path and dies on. If Mac signing on CI is ever
# wanted, add the secrets first and gate the env block on their presence.
#
# Notes:
#   - GITHUB_TOKEN is auto-provided by GitHub Actions.
#   - electron-builder auto-creates latest.yml / latest-mac.yml / latest-linux.yml
#     alongside the binary artifacts when --publish is used.
#   - mac signing on the runner uses `security import` + Keychain ACL; if
#     secrets are missing, electron-builder still produces an unsigned .dmg
#     (build still succeeds — just no Developer ID signature).
#
# Future: add a `prerelease` channel + signed Win builds once the EV cert is set up.

name: Build + Release Farnsworth

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering this manually?'
        required: false
        default: 'manual test build'

permissions:
  contents: write   # needed to create the GitHub Release on tag push

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to 20 deliberately. DO NOT BUMP without testing Windows.
      # On 22, node-pty has no matching prebuild, so npm ci falls back to
      # `node-gyp rebuild` from source and fails to compile on the
      # windows-latest image: conpty.cc cannot resolve PFNCREATEPSEUDOCONSOLE
      # and friends against the runner's Windows SDK. Verified by run
      # 30754145627, where the bump moved the Windows failure earlier rather
      # than fixing it.
      #
      # This is unrelated to the "Node 20 is being deprecated" annotation in
      # the logs: that refers to the runtime GitHub uses to execute JS actions
      # like actions/checkout, not to the toolchain version selected here.
      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resources/bin (the bundled `claude` + `nono` CLIs) is gitignored —
      # claude alone is ~226 MB, past GitHub's 100 MB file limit — so it never
      # exists on a runner. electron-builder reports the absence as a single
      # forgettable `file source doesn't exist` line and packages the artifact
      # anyway, which is how every CI-published Windows and Linux build through
      # v0.1.26 shipped without them.
      #
      # The script fetches the binaries for the RUNNER's platform with sha256
      # verification. Copying the Mac's arm64 Mach-O binaries into a Windows or
      # Linux artifact would ship ~242 MB that can never execute.
      #
      # Windows gets neither: Anthropic's installer refuses Windows outright
      # and nono publishes no Windows asset. The script says so and exits 0.
      - name: Fetch bundled binaries (claude + nono)
        shell: bash
        run: ./scripts/fetch-bundled-binaries.sh

      # Fail loudly if a platform that IS supposed to carry the binaries lost
      # them. Without this the only signal is a warning nobody reads.
      - name: Verify bundled binaries
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          missing=0
          for b in claude nono; do
            if [ -x "Resources/bin/$b" ]; then
              echo "ok: Resources/bin/$b ($(du -h "Resources/bin/$b" | cut -f1))"
            else
              echo "::error title=Bundled binary missing::Resources/bin/$b was not provisioned"
              missing=1
            fi
          done
          exit $missing

      # ==================================================================
      # macOS — BUILD VALIDATION ONLY. Never publishes. See below.
      # ==================================================================
      #
      # This job must NEVER upload to the GitHub Release, and the reason is
      # load-bearing.
      #
      # There are no Apple signing secrets in this repo (verified Aug 2:
      # `GET /actions/secrets` returns total_count 0). So a mac build here is
      # UNSIGNED. electron-builder's implicit tag publishing would upload that
      # unsigned zip/dmg AND overwrite `latest-mac.yml` — the manifest every
      # installed Mac polls for updates. Squirrel.Mac validates the code
      # signature, so every Mac user's auto-update would break. That is the
      # same class of outage as v0.1.19, where a release carrying only
      # win/linux assets took down Mac auto-update.
      #
      # Signed Mac artifacts are built locally on the Mac mini with the real
      # Developer ID and uploaded by hand. CI's job on macOS is to catch build
      # breakage, nothing more. Hence `--publish never`.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY=false is required because
      # electron-builder.yml pins a mac `identity:` that does not exist in the
      # runner's Keychain.
      #
      # The CSC_LINK / APPLE_* env vars that used to live here are deliberately
      # gone. A missing secret in GitHub Actions expands to an EMPTY STRING,
      # not an unset variable, and electron-builder resolves an empty CSC_LINK
      # as a path relative to the project root — yielding the project dir
      # itself and the fatal `⨯ <projectDir> not a file`. That single empty
      # string is what made every tagged mac build red since v0.1.19.
      - name: Build (macOS — validation, never published)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ==================================================================
      # Windows — NSIS installer, unsigned (no EV cert yet)
      # ==================================================================
      # `--publish` is explicit: implicit tag-triggered publishing is
      # deprecated and removed in electron-builder v27.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================================
      # Linux — AppImage + .deb
      # ==================================================================
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `shell: bash` is mandatory here. The default shell on windows-latest is
      # pwsh, where `ls` aliases to Get-ChildItem and `-lh` is not a valid
      # parameter — a ParserError that failed the whole Windows job *after* the
      # installer had already built and uploaded successfully, and which
      # skipped the artifact upload below. Git Bash ships on all three runners.
      - name: List build artifacts
        shell: bash
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farnsworth-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 14