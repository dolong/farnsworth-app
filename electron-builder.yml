# electron-builder.yml — Farnsworth packaging config
#
# Build targets:
#   npm run dist         — build for the current platform (mac/win/linux)
#   npm run dist:mac     — macOS only (.dmg + .zip for arm64 + x64)
#   npm run dist:win     — Windows only (.exe via NSIS, x64; unsigned for now)
#   npm run dist:linux   — Linux only (.AppImage + .deb)
#   npm run dist:dir     — fast local build (no .dmg, just unpacked .app in dist/)
#
# Signing (mac): Developer ID Application: Long Do (66RHAVPZ4J)
#   - Already imported to login Keychain
#   - Hardened runtime + V8 JIT entitlements from scripts/entitlements-electron.plist
#   - Notarization needs APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID env vars

appId: dev.probablynothing.farnsworth
productName: Farnsworth
copyright: Copyright © 2026 Long. MIT License.
directories:
  output: dist
  buildResources: build-cache

# Files to bundle inside the .app's Resources/app.asar
files:
  # index.html is the renderer entry point — main.js does
  # loadFile(path.join(__dirname, 'index.html')). It was MISSING from this
  # list through v0.1.0/v0.1.1/v0.1.2, so every packaged build opened a
  # black window (menu bar worked because that's main-process code).
  # An explicit `files` list REPLACES electron-builder's default "**/*",
  # so anything not named here simply isn't in the app.
  - index.html
  - main.js
  - preload.js
  - src/**/*
  # devvit-emulator/loader.mjs is injected into the user's dev-server
  # subprocess via NODE_OPTIONS --import. Also absent from packaged builds,
  # so the emulator silently no-op'd (main.js guards on existsSync).
  # Must ALSO be in asarUnpack below: the loader path is handed to a plain
  # node child process, which cannot read inside app.asar.
  - devvit-emulator/**/*
  # nono sandbox profiles for the Claude Code panel + chat-agent run_command.
  # These used to live ONLY in ~/.config/nono/profiles/ on the authoring
  # machine, so every other install hit "nono: Profile not found". Like the
  # emulator loader, they're read by the nono process (no asar support) and
  # must ALSO be in asarUnpack below.
  - nono-profiles/**/*
  - db.js
  - pair-device.js
  - relay-client.js
  - check_ipcs.mjs
  - assets/**/*
  - styles.css
  - canvas-styles.css
  - "!**/.DS_Store"
  - "!**/.git"
  - "!**/.gitignore"
  - "!**/*.map"
  - "!**/*.log"

# Bundled CLI binaries (claude + nono) — sit alongside the .app's Resources/app.asar
# at Contents/Resources/bin/, exactly where the dev wrapper puts them
extraResources:
  - from: Resources/bin
    to: bin
    filter:
      - "**/*"
  # farnsworth-test.py is run by an EXTERNAL python process, which has no asar
  # support and cannot read a file inside app.asar. Through v0.1.5 it was never
  # packaged at all and Test View resolved it inside the asar, so no test could
  # run on an installed build (Jul 29). Resolved by resolveTestRunnerPath().
  - from: farnsworth-test.py
    to: test-runner/farnsworth-test.py

# Native modules must be unpacked from asar (they can't be loaded from inside)
# Runs after the app is packed, BEFORE signing. Guarantees every bundled file is
# owner-writable, because Squirrel.Mac must strip the quarantine xattr from each
# file during an auto-update and removexattr() needs write permission. One
# mode-555 file (Resources/bin/nono) silently killed every macOS update install
# with "Permission denied" -> "Too many attempts to install, aborting update".
afterPack: scripts/after-pack-ensure-writable.js

asar: true
asarUnpack:
  # Read by a spawned plain-node process (NODE_OPTIONS --import), which has
  # no asar support — must exist as real files on disk.
  - "devvit-emulator/**/*"
  # Read by the nono binary, a separate process with no asar support.
  - "nono-profiles/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/keytar/**/*"
  - "node_modules/node-pty/**/*"
  - "node_modules/onnxruntime-node/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/fsevents/**/*"
  - "node_modules/**/*.node"
  - "node_modules/**/*.dylib"
  - "node_modules/**/*.so"

# macOS
#   teamId is set via APPLE_TEAM_ID env var at build time (no teamId field
#   in the v26 schema); notarytool picks it up from there.
mac:
  category: public.app-category.developer-tools
  icon: Resources/farnsworth-icon.icns
  # BOTH targets are required, for different jobs:
  #   dmg — what a human downloads for a FIRST install.
  #   zip — what electron-updater/Squirrel.Mac consumes for AUTO-UPDATE.
  # Through v0.1.9 this list was dmg-only, so macOS auto-update was broken for
  # every installed user of every version. electron-updater's MacUpdater calls
  # findFile(files, 'zip', ['pkg','dmg']) and throws
  # ERR_UPDATER_ZIP_FILE_NOT_FOUND when no .zip is in latest-mac.yml. The error
  # only reached a console.warn, so it failed invisibly (Jul 29).
  # The arch suffix in the filename is load-bearing: MacUpdater.filterFilesForArch
  # selects by matching the literal string "arm64" in the file name.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "Long Do (66RHAVPZ4J)"  # electron-builder picks the right cert type from the prefix-less common name
  entitlements: scripts/entitlements-electron.plist
  entitlementsInherit: scripts/entitlements-electron.plist
  notarize: true

dmg:
  sign: false  # .app is signed; .dmg itself doesn't need a separate signature
  title: "${productName} ${version}"

# Windows (unsigned for now — no EV cert; SmartScreen will warn on first launch)
win:
  target:
    - target: nsis
      arch:
        - x64

# Linux
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: long@probablynothing.dev
  vendor: Long

# Publishing (GitHub Releases) — electron-updater reads app-update.yml;
# electron-builder reads this to know where to push artifacts on --publish.
# `releaseType: release` (vs prerelease/draft) makes the release public
# immediately on publish. To make a draft: omit --publish, push tags,
# then `gh release create <tag> --draft ./dist/*.{dmg,exe,deb,AppImage,...}`.
publish:
  provider: github
  owner: dolong
  repo: farnsworth-app
  releaseType: release

# Use maximum compression for smaller downloads
compression: maximum